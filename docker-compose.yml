services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: realitysync
      POSTGRES_PASSWORD: realitysync
      POSTGRES_DB: realitysync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realitysync"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    # Secrets (JWT_SECRET, ADMIN_*, GEMINI_API_KEY) come from .env: `cp .env.example .env`.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://realitysync:realitysync@db:5432/realitysync
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WATCH_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep the container's own (Linux) node_modules instead of the host's.
      - /app/node_modules

volumes:
  pgdata:
