name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: realitysync
          POSTGRES_PASSWORD: realitysync
          POSTGRES_DB: realitysync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      # Dummy value: CI never issues real tokens.
      JWT_SECRET: ci-only-not-a-secret
      DATABASE_URL: postgresql+asyncpg://realitysync:realitysync@localhost:5432/realitysync
      # Setting this makes DB tests run against the service instead of skipping.
      DATABASE_URL_TEST: postgresql+asyncpg://realitysync:realitysync@localhost:5432/realitysync
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e "backend[dev]"
      - name: Lint (ruff + import-linter)
        run: make lint-backend
      - name: Type check
        run: make types-backend
      - name: Migrations apply on an empty database
        working-directory: backend
        run: alembic upgrade head
      - name: Models match migrations
        working-directory: backend
        run: alembic check
      - name: Test
        run: make test-backend

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        run: make lint-frontend
      - name: Type check
        run: make types-frontend
      - name: Test
        run: make test-frontend
